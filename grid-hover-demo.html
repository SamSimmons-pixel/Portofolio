<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Hover Expand Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 60px 40px;
  }
  h1 { font-weight: 500; margin-bottom: 8px; }
  p.note { color: #888; margin-top: 0; margin-bottom: 40px; font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
  }

  .card {
    position: relative;
    background: #1c1c1c;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transform-origin: center center;
    /* transform is the ONLY thing that animates while in-grid — cheap, no reflow */
    transition: transform 0.25s ease;
  }

  .card .img {
    width: 100%;
    height: 120px;
    border-radius: 8px;
    background: linear-gradient(135deg, #444, #222);
    margin-bottom: 14px;
  }

  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; color: #aaa; line-height: 1.4; }

  /* state applied by JS during expansion — position:fixed with an
     explicit starting rect so there's no jump */
  .card.expanding, .card.expanded, .card.collapsing {
    position: fixed;
    z-index: 1000;
    transition: top 0.4s cubic-bezier(.4,0,.2,1),
                left 0.4s cubic-bezier(.4,0,.2,1),
                width 0.4s cubic-bezier(.4,0,.2,1),
                height 0.4s cubic-bezier(.4,0,.2,1),
                transform 0.4s cubic-bezier(.4,0,.2,1);
    transform: none !important; /* kill the proximity scale while expanded */
  }

  .card.expanded .img { height: 45%; }
  .card.expanded p { font-size: 16px; }

  .placeholder { visibility: hidden; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.4s ease;
    z-index: 999;
  }
  .overlay.active { background: rgba(0,0,0,0.6); pointer-events: auto; }
</style>
</head>
<body>

<h1>Experience Grid</h1>
<p class="note">Move your mouse around — nearby cards scale slightly. Click a card to expand it to center. Click the overlay or the card again to collapse.</p>

<div class="grid" id="grid">
  <!-- cards injected by JS -->
</div>

<div class="overlay" id="overlay"></div>

<script>
const data = [
  { title: "Freelance — Laravel API", desc: "Built REST endpoints for a client dashboard, handled auth and rate limiting." },
  { title: "Flutter Mobile App", desc: "Cross-platform app with offline-first sync and push notifications." },
  { title: "TV Studio Integration", desc: "Laravel backend feeding a live broadcast timing system via vMix." },
  { title: "Blender Addon", desc: "Python tool pulling YouTube reference footage into the VSE timeline." },
  { title: "Portfolio Site", desc: "This very site — grid layout, custom hover interactions, no framework." },
  { title: "Internal Tooling", desc: "Small admin panel for managing content across client projects." },
];

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');

data.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index = i;
  card.innerHTML = `
    <div class="img"></div>
    <h3>${item.title}</h3>
    <p>${item.desc}</p>
  `;
  grid.appendChild(card);
});

const cards = Array.from(document.querySelectorAll('.card'));
let expandedCard = null;
let placeholder = null;

// --- Proximity scale: cheap, transform-only, no layout impact ---
document.addEventListener('mousemove', (e) => {
  if (expandedCard) return; // don't fight the expand animation
  cards.forEach(card => {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);

    const maxDist = 300;   // influence radius
    const maxScale = 1.06; // how big it gets at distance 0
    const t = Math.max(0, 1 - dist / maxDist);
    const scale = 1 + t * (maxScale - 1);

    card.style.transform = `scale(${scale.toFixed(3)})`;
  });
});

// --- FLIP expand ---
// cards.forEach(card => {
//   card.addEventListener('click', () => {
//     if (expandedCard === card) return collapse();
//     if (expandedCard) return;
//     expand(card);
//   });
// });
// overlay.addEventListener('click', collapse);

cards.forEach(card => {
  card.addEventListener('mouseenter', () => {
    if (expandedCard) return;
    expand(card);
  });

  card.addEventListener('mouseleave', () => {
    if (expandedCard === card) return collapse();
  });
});

function expand(card) {
  const rect = card.getBoundingClientRect();

  // hold the grid slot open
  placeholder = document.createElement('div');
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  card.parentNode.insertBefore(placeholder, card);

  // pin the card exactly where it already visually is — no jump
  Object.assign(card.style, {
    top: rect.top + 'px',
    left: rect.left + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
    margin: 0,
  });
  card.classList.add('expanding');
  document.body.appendChild(card);

  card.offsetHeight; // force reflow so the browser commits the starting rect

  requestAnimationFrame(() => {
    const targetW = Math.min(window.innerWidth * 0.6, 600);
    const targetH = Math.min(window.innerHeight * 0.7, 500);
    Object.assign(card.style, {
      top: (window.innerHeight - targetH) / 2 + 'px',
      left: (window.innerWidth - targetW) / 2 + 'px',
      width: targetW + 'px',
      height: targetH + 'px',
    });
    card.classList.remove('expanding');
    card.classList.add('expanded');
    overlay.classList.add('active');
  });

  expandedCard = card;
}

function collapse() {
  if (!expandedCard) return;
  const card = expandedCard;
  const rect = placeholder.getBoundingClientRect();

  card.classList.remove('expanded');
  card.classList.add('collapsing');
  overlay.classList.remove('active');

  Object.assign(card.style, {
    top: rect.top + 'px',
    left: rect.left + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
  });

  card.addEventListener('transitionend', function done() {
    card.removeEventListener('transitionend', done);
    card.classList.remove('collapsing');
    ['position','top','left','width','height','margin','zIndex'].forEach(p => card.style[p] = '');
    placeholder.parentNode.insertBefore(card, placeholder);
    placeholder.remove();
  placeholder = null;
    expandedCard = null;
  }, { once: true });
}
</script>
</body>
</html>
