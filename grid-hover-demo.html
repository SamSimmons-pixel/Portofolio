<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Hover Expand Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 60px 40px;
  }
  h1 { font-weight: 500; margin-bottom: 8px; }
  p.note { color: #888; margin-top: 0; margin-bottom: 40px; font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
  }

  .card {
    position: relative;
    background: #1c1c1c;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transform-origin: center center;
    transition: transform 0.25s ease, opacity 0.15s ease;
  }

  .card .img {
    width: 100%;
    height: 120px;
    border-radius: 8px;
    background: linear-gradient(135deg, #444, #222);
    margin-bottom: 14px;
  }

  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 0; font-size: 13px; color: #aaa; line-height: 1.4; }

  /* the clone that actually flies to center */
  .clone .img { height: 45%; }
  .clone p { font-size: 16px; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.4s ease;
    z-index: 999;
  }
  .overlay.active { background: rgba(0,0,0,0.6); }
</style>
</head>
<body>

<h1>Experience Grid</h1>
<p class="note">Move your mouse around — nearby cards scale slightly. Hover a card to expand it to center. Move away to collapse.</p>

<div class="grid" id="grid"></div>
<div class="overlay" id="overlay"></div>

<script>
const data = [
  { title: "Freelance — Laravel API", desc: "Built REST endpoints for a client dashboard, handled auth and rate limiting." },
  { title: "Flutter Mobile App", desc: "Cross-platform app with offline-first sync and push notifications." },
  { title: "TV Studio Integration", desc: "Laravel backend feeding a live broadcast timing system via vMix." },
  { title: "Blender Addon", desc: "Python tool pulling YouTube reference footage into the VSE timeline." },
  { title: "Portfolio Site", desc: "This very site — grid layout, custom hover interactions, no framework." },
  { title: "Internal Tooling", desc: "Small admin panel for managing content across client projects." },
];

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');

data.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index = i;
  card.innerHTML = `
    <div class="img"></div>
    <h3>${item.title}</h3>
    <p>${item.desc}</p>
  `;
  grid.appendChild(card);
});

const cards = Array.from(document.querySelectorAll('.card'));
let activeClone = null;
let activeOriginal = null;

// --- Proximity scale: skipped for whichever card is currently expanded ---
document.addEventListener('mousemove', (e) => {
  cards.forEach(card => {
    if (card === activeOriginal) return;
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);

    const maxDist = 300;
    const maxScale = 1.06;
    const t = Math.max(0, 1 - dist / maxDist);
    const scale = 1 + t * (maxScale - 1);
    card.style.transform = `scale(${scale.toFixed(3)})`;
  });
});

// --- Hover expand via clone. The original NEVER moves, so its rect
//     is always trustworthy and it never loses the pointer mid-animation. ---
cards.forEach(card => {
  card.addEventListener('mouseenter', () => expand(card));
  card.addEventListener('mouseleave', () => collapse());
});
overlay.addEventListener('mouseenter', () => collapse());

function expand(card) {
  if (activeOriginal) return;
  const rect = card.getBoundingClientRect();

  const clone = card.cloneNode(true);
  clone.classList.add('clone');
  clone.style.transform = 'none'; // strip any inherited proximity-scale transform
  Object.assign(clone.style, {
    position: 'fixed',
    top: rect.top + 'px',
    left: rect.left + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
    margin: 0,
    zIndex: 1000,
    pointerEvents: 'none', // clone is purely visual — never a hover target
    transition: 'top .4s cubic-bezier(.4,0,.2,1), left .4s cubic-bezier(.4,0,.2,1), width .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1)',
  });
  document.body.appendChild(clone);
  clone.offsetHeight; // commit starting rect before animating

  card.style.opacity = '0'; // hide original, keep its box so it still owns hover

  requestAnimationFrame(() => {
    const targetW = Math.min(window.innerWidth * 0.6, 600);
    const targetH = Math.min(window.innerHeight * 0.7, 500);
    Object.assign(clone.style, {
      top: (window.innerHeight - targetH) / 2 + 'px',
      left: (window.innerWidth - targetW) / 2 + 'px',
      width: targetW + 'px',
      height: targetH + 'px',
    });
  });

  overlay.classList.add('active');
  activeClone = clone;
  activeOriginal = card;
}

function collapse() {
  if (!activeClone) return;
  // original never moved, so this rect is always its true grid position
  const rect = activeOriginal.getBoundingClientRect();
  Object.assign(activeClone.style, {
    top: rect.top + 'px',
    left: rect.left + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px',
  });
  overlay.classList.remove('active');

  const clone = activeClone;
  const original = activeOriginal;
  activeClone = null;
  activeOriginal = null;

  clone.addEventListener('transitionend', function done() {
    clone.removeEventListener('transitionend', done);
    clone.remove();
    original.style.opacity = '';
  }, { once: true });
}
</script>
</body>
</html>
